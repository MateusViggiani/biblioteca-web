name: CI/CD Biblioteca Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Testes do backend (JUnit + Mockito)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Testes unitários e de integração
        run: mvn -B test

  test-frontend:
    name: Testes e build do frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes (Jest)
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build de produção
        run: npm run build

  deploy:
    name: Docker + testes de aceitação
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build das imagens
        run: docker compose build

      - name: Subir os containers
        run: docker compose up -d

      - name: Aguardar o backend
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/api/autores && exit 0
            sleep 3
          done
          docker compose logs backend
          exit 1

      - name: Testes de aceitação (curl)
        run: |
          AUTOR=$(curl -sf -X POST http://localhost:8080/api/autores \
            -H 'Content-Type: application/json' \
            -d '{"nome": "Machado de Assis", "nacionalidade": "Brasileira", "dataNascimento": "1839-06-21"}')
          echo "$AUTOR"
          AUTOR_ID=$(echo "$AUTOR" | jq '.id')

          curl -sf -X POST http://localhost:8080/api/livros \
            -H 'Content-Type: application/json' \
            -d "{\"titulo\": \"Dom Casmurro\", \"anoPublicacao\": 1899, \"autor\": {\"id\": $AUTOR_ID}}"

          curl -sf http://localhost:8080/api/livros/autor/$AUTOR_ID | jq -e '.[0].autor.nome == "Machado de Assis"'
          curl -sf http://localhost:3000/ | grep -q '<div id="root">'
          curl -sf http://localhost:3000/api/livros | jq -e 'length == 1'

      - name: Derrubar os containers
        if: always()
        run: docker compose down -v
